services:
  - type: web
    name: smart-farmer-assistance-system
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATA_GOV_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
